{% extends 'base.html' %}

{% block header %}
  <h1>Add Credential</h1>
{% endblock %}

{% block content %}
  <form method="post">
    <label for="website_name">Website Name</label>
    <input name="website_name" id="website_name" required>
    
    <label for="website_url">Website URL</label>
    <input name="website_url" id="website_url" type="text">
    
    <label for="username">Username / Email</label>
    <input name="username" id="username">

    <label for="password">Password</label>
    <input type="text" name="password" id="password" required>
    
    <label for="category_id">Existing Category</label>
    <select name="category_id" id="category_id">
      <option value="">-- None --</option>
      {% for cat in categories %}
        <option value="{{ cat.category_id }}">{{ cat.category_name }}</option>
      {% endfor %}
    </select>

    <label for="new_category">Or Create New Category</label>
    <input type="text" name="new_category" id="new_category" placeholder="Type a new category name...">

    <label for="notes">Notes</label>
    <textarea name="notes" id="notes"></textarea>
    
    <input type="submit" value="Save">
  </form>
{% endblock %}
